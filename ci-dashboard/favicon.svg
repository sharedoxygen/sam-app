<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#backgroundGradient)" stroke="#374151" stroke-width="1"/>
  
  <!-- Main gear (CI/CD automation) -->
  <g transform="translate(20, 8)">
    <path d="M 0 -3 L 1.5 -2.5 L 2.5 -1.5 L 3 0 L 2.5 1.5 L 1.5 2.5 L 0 3 L -1.5 2.5 L -2.5 1.5 L -3 0 L -2.5 -1.5 L -1.5 -2.5 Z" 
          fill="url(#gearGradient)" stroke="#065f46" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="1.2" fill="#1f2937" stroke="#065f46" stroke-width="0.3"/>
  </g>
  
  <!-- Rocket (deployment/builds) -->
  <g transform="translate(12, 20)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="-2" rx="2.5" ry="6" fill="url(#rocketGradient)" stroke="#1e40af" stroke-width="0.5"/>
    <!-- Rocket tip -->
    <path d="M -1.5 -8 Q 0 -10 1.5 -8 L 1.5 -6 L -1.5 -6 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.3"/>
    <!-- Rocket fins -->
    <path d="M -2.5 2 L -3.5 4 L -1.5 3 Z" fill="#ef4444" stroke="#dc2626" stroke-width="0.3"/>
    <path d="M 2.5 2 L 3.5 4 L 1.5 3 Z" fill="#ef4444" stroke="#dc2626" stroke-width="0.3"/>
    <!-- Rocket window -->
    <circle cx="0" cy="-4" r="1" fill="#60a5fa" stroke="#2563eb" stroke-width="0.3"/>
    <!-- Exhaust -->
    <path d="M -1 2 Q 0 5 1 2" fill="#f97316" opacity="0.7"/>
  </g>
  
  <!-- Pipeline dots (data flow) -->
  <circle cx="6" cy="16" r="1" fill="#10b981" opacity="0.8"/>
  <circle cx="9" cy="14" r="0.8" fill="#3b82f6" opacity="0.6"/>
  <circle cx="9" cy="18" r="0.8" fill="#3b82f6" opacity="0.6"/>
  
  <!-- Status indicator -->
  <circle cx="26" cy="26" r="2" fill="#10b981" stroke="#047857" stroke-width="0.5"/>
  <path d="M 24.5 26 L 25.5 27 L 27.5 25" stroke="#ffffff" stroke-width="0.8" fill="none" stroke-linecap="round"/>
</svg> 