apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-activity-manager
  labels:
    app: sales-activity-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sales-activity-manager
  template:
    metadata:
      labels:
        app: sales-activity-manager
    spec:
      containers:
        - name: sales-activity-manager
          image: gcr.io/PROJECT_ID/sales-activity-manager:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: 'production'
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: sam-db-credentials
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: sam-db-credentials
                  key: port
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: sam-db-credentials
                  key: name
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: sam-db-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sam-db-credentials
                  key: password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sam-db-credentials
                  key: url
            - name: NEXTAUTH_URL
              value: 'https://sam.example.com'
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: sam-app-secrets
                  key: nextauth_secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sales-activity-manager-service
spec:
  selector:
    app: sales-activity-manager
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sales-activity-manager-ingress
  annotations:
    kubernetes.io/ingress.class: 'gce'
    kubernetes.io/ingress.global-static-ip-name: 'sam-static-ip'
    networking.gke.io/managed-certificates: 'sam-managed-cert'
spec:
  rules:
    - host: sam.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sales-activity-manager-service
                port:
                  number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: sam-managed-cert
spec:
  domains:
    - sam.example.com
